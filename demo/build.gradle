plugins {
    id 'com.android.application'
}

android {
    compileSdkVersion 34
    buildToolsVersion "30.0.3"

    defaultConfig {
        applicationId "com.hss01248.takephoto.demo"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug{
            crunchPngs false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lintOptions {
        abortOnError false
    }
    packagingOptions {
        pickFirst '**/libc++_shared.so'
        pickFirst '**/libavcodec.so'
        pickFirst '**/libavformat.so'
        pickFirst '**/libavutil.so'
        pickFirst '**/libswscale.so'
        //FFmpegMediaMetadataRetriever-1.0.14/jni/arm64-v8a/libavformat.so
        //jni/arm64-v8a/libavcodec.so
        pickFirst '**/META-INF/DEPENDENCIES'
        pickFirst '**/META-INF/kotlin-stdlib-jdk7.kotlin_module'
        // 忽略特定路径下的所有 PNG 文件
        exclude 'res/drawable-xhdpi-v4/ic_launcher.png'
    }
}

dependencies {
    implementation "androidx.multidex:multidex:2.0.0"
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'com.google.android.material:material:1.3.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    testImplementation 'junit:junit:4.+'
    androidTestImplementation 'androidx.test.ext:junit:1.1.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.3.0'

   // api"com.github.hss01248.utilcodeEnhance:media:1.7.0"

    implementation project(':api')
    implementation project(':videocompress_ffmpeg')
     implementation("com.github.hss01248.utilcodeEnhance2:media:2.1.06")
    implementation("com.github.hss01248.utilcodeEnhance2:otg-usb-impls:2.1.06")
    implementation("com.github.hss01248.utilcodeEnhance2:fileOperation:2.1.06")
    //implementation "com.simple:spiderman:1.1.7"
}

configurations {
    all*.exclude group: 'com.android.support' , module: 'support-compat'
    all*.exclude group: 'com.davemorrissey.labs' , module: 'subsampling-scale-image-view'

    all*.exclude group: 'com.github.hss01248.utilcodeEnhance'
    all*.exclude group: 'com.github.hss01248.ImageLoader'

    all*.exclude group: 'org.jetbrains.kotlin' , module: 'kotlin-stdlib-jdk8'
    all*.exclude group: 'org.jetbrains.kotlin' , module: 'kotlin-stdlib-jdk7'
    all*.exclude group: 'org.jetbrains.kotlin' , module: 'kotlin-stdlib-jdk7'
    //org.jetbrains.kotlin:kotlin-stdlib
    //org.jetbrains.kotlin:kotlin-stdlib-jdk8
    //org.jetbrains.kotlin:kotlin-stdlib-jdk7
    //com.davemorrissey.labs:subsampling-scale-image-view
}